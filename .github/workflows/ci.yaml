name: CI

on:
  push:
    branches: ["master", "main"]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    env: 
      AWS_REGION: ${{ vars.AWS_REGION }}
      TABLE_NAME: ${{ vars.TABLE_NAME }}
      USER_POOL_ID: ${{ vars.USER_POOL_ID }}
      USER_POOL_CLIENT_ID: ${{ vars.USER_POOL_CLIENT_ID }}
      IDENTITY_POOL_ID: ${{ vars.IDENTITY_POOL_ID }}
      SLACK_WEBHOOK_URL: ${{ vars.SLACK_WEBHOOK_URL }}
      TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install  

      - name: Build
        run: pnpm run build
      
      - name: Debug env vars
        run: |
          echo "USER_POOL_ID is set: ${{ vars.USER_POOL_ID != '' }}"
          echo "USER_POOL_CLIENT_ID is set: ${{ vars.USER_POOL_CLIENT_ID != '' }}"

      - name: Test
        run: pnpm run test